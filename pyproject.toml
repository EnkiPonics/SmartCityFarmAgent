[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enkiponics-osi-hackathon"
version = "0.1.0"
description = "OSI Hackathon - EnkiPonics sensor data analysis and LSTM modeling"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "tensorflow>=2.16",
  "scikit-learn>=1.5",
  "keras>=3.0",
  "pymc>=4.0",
  "arviz>=0.14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

